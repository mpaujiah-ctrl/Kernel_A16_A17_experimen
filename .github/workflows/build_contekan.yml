name: Build Kernel cepheus

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Defconfig target'
        default: 'cepheus_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo sendiri
      uses: actions/checkout@v4

    - name: Clone Kernel Source + KernelSU
      run: |
        git clone --depth=1 https://github.com/mpaujiah-ctrl/kernel_xiaomi_cepheus_PixelOS kernel
        git clone --depth=1 https://github.com/tiann/kernelSU kernel/KernelSU

    - name: Apply KernelSU Patch
      run: |
        echo 'KERNELSU := true' >> kernel/Makefile
        sed -i '1i#include <ksu/ksu.h>' kernel/init/main.c
        sed -i '/start_kernel()/a\ \ \ \ ksu_init();' kernel/init/main.c

    - name: Setup Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git

    - name: Build Kernel
      run: |
        cd kernel
        export PATH="../proton-clang/bin:$PATH"
        export ARCH=arm64
        make O=out cepheus_defconfig
        make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3
        echo "=== Ganti anykernel.sh & ak3-core.sh ==="
        cp anykernel.sh AnyKernel3/anykernel.sh
        cp ak3-core.sh AnyKernel3/tools/ak3-core.sh
        cat AnyKernel3/anykernel.sh

    - name: Pack AnyKernel3
      run: |
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3 && zip -r9 ../cepheus_POSS_KSU.zip * -x README

    - name: Upload Result
      uses: actions/upload-artifact@v4
      with:
        name: cepheus-poss-ksu
        path: cepheus_POSS_KSU.zip
