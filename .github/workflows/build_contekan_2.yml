name: Build cepheus kernel (KernelSU-Next UAPI 5)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Kernel source branch/tag to build'
        default: '17.0-stable'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.ref || '17.0-stable' }}

      - name: Backport KernelSU-Next UAPI 5 (EVENT_SERVICES)
        run: python3 ci/apply_uapi5.py .

      - name: Verify UAPI bump
        run: |
          grep -nE "KERNEL_SU_UAPI_VERSION|EVENT_SERVICES" drivers/kernelsu/include/uapi/supercall.h
          grep -q "EVENT_SERVICES" drivers/kernelsu/supercall/dispatch.c

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget build-essential bc bison flex libssl-dev libelf-dev \
            libyaml-dev pkg-config python3 zip unzip cpio ccache rsync \
            device-tree-compiler \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      - name: Download Neutron Clang
        run: |
          mkdir -p "$HOME/tc/neutron-clang"
          cd "$HOME/tc/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          ls bin | head

      - name: Configure kernel
        run: |
          export PATH="$HOME/tc/neutron-clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          # workarounds for building CAF 4.14 with a modern clang
          sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/' scripts/dtc/Makefile || true
          sed -i 's#python2 $(srctree)/scripts/dtc/mkdtboimg.py#python3 $(srctree)/scripts/dtc/mkdtboimg.py#' scripts/Makefile.lib || true
          curl -fsSL "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" | base64 -d > scripts/dtc/mkdtboimg.py
          printf '\nKBUILD_CFLAGS += -Wno-error\n' >> Makefile
          make O=out ARCH=arm64 vendor/sm8150-perf_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/xiaomi/sm8150-common.config arch/arm64/configs/vendor/xiaomi/cepheus.config
          make O=out ARCH=arm64 olddefconfig
          echo "== relevant config =="
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64" out/.config || true

      - name: Build kernel
        run: |
          export PATH="$HOME/tc/neutron-clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
          export KBUILD_BUILD_USER="cepheus"
          export KBUILD_BUILD_HOST="github-actions"
          # in-tree dtc 1.4.4 is too old for this tree's DT overlays; use system dtc
          dtc --version
          make -j"$(nproc --all)" O=out ARCH=arm64 DTC=dtc \
            CC=clang AR=llvm-ar LD=ld.lld NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            Image.gz-dtb
          echo "== build output =="
          ls -l out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/JoK3rLeE/AnyKernel3.git anykernel
          rm -rf anykernel/.git*
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 "../cepheus-KSUN-UAPI5-$(date +%Y%m%d).zip" . -x "README*" "*.zip" ".git*"
          cd ..
          ls -l *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-kernel
          path: cepheus-KSUN-UAPI5-*.zip
          if-no-files-found: error
