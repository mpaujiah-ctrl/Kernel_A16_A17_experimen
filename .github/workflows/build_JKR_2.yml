name: Build Kernel Cepheus A17 RIJEK24

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/JoK3rLeE/android_kernel_xiaomi_sm8150"
  KERNEL_BRANCH: "17-ksun"
  CLANG_VERSION: clang-r596125
  BASE_DEFCONFIG: "arch/arm64/configs/vendor/sm8150-perf_defconfig"
  DEVICE_FRAGMENT: "arch/arm64/configs/vendor/xiaomi/cepheus.config"
  COMMON_FRAGMENT: "arch/arm64/configs/vendor/xiaomi/sm8150-common.config"
  KERNEL_ARCH: "arm64"
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Sendiri
      uses: actions/checkout@v4
           
    - name: Clone kernel source (ikut update branch)
      run: |
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_SOURCE }}" kernel       
   
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libelf-dev libssl-dev python3 rsync cpio zip unzip curl

    - name: Install Android Clang
      run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang"
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/${CLANG_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/${CLANG_VERSION}.tar.gz"
          tar -xzf "$RUNNER_TEMP/${CLANG_VERSION}.tar.gz" -C "$RUNNER_TEMP/clang"
          test -x "$RUNNER_TEMP/clang/bin/clang"
          test -x "$RUNNER_TEMP/clang/bin/ld.lld"
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang/bin/clang" --version
          "$RUNNER_TEMP/clang/bin/ld.lld" --version | head -n 1

    - name: Prepare Cepheus configuration
      working-directory: kernel
      run: |
        set -euo pipefail
        OUT="$GITHUB_WORKSPACE/kernel/out"
        MERGE="scripts/kconfig/merge_config.sh"

        rm -rf "$OUT"
        mkdir -p "$OUT"

        test -f "${BASE_DEFCONFIG}"
        test -f "${DEVICE_FRAGMENT}"
        test -f "${COMMON_FRAGMENT}"
        test -x "$MERGE" || chmod +x "$MERGE"

        "$MERGE" -m -O "$OUT" \
          "${BASE_DEFCONFIG}" \
          "${DEVICE_FRAGMENT}" \
          "${COMMON_FRAGMENT}"

        test -s "$OUT/.config"

        scripts/config --file out/.config \
          -d LTO_CLANG -d CFI_CLANG -d CFI_CLANG_SHADOW \
          --set-val LTO_NONE y
        make O="$OUT" ARCH="$ARCH" LLVM=1 LLVM_IAS=1 olddefconfig

        echo "Final Cepheus configuration:"
        grep -E '^(CONFIG_MACH_XIAOMI_CEPHEUS|CONFIG_TOUCHSCREEN_ST_FTS_V521|CONFIG_FTS_FOD_AREA_REPORT|CONFIG_BUILD_ARM64_DT_OVERLAY)=' "$OUT/.config"

        test "$(grep -c '^CONFIG_MACH_XIAOMI_CEPHEUS=y$' "$OUT/.config")" -eq 1
        test "$(grep -c '^CONFIG_TOUCHSCREEN_ST_FTS_V521=y$' "$OUT/.config")" -eq 1
        test "$(grep -c '^CONFIG_FTS_FOD_AREA_REPORT=y$' "$OUT/.config")" -eq 1
        test "$(grep -c '^CONFIG_BUILD_ARM64_DT_OVERLAY=y$' "$OUT/.config")" -eq 1
           
    - name: Clone AnyKernel3
      run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          echo "=== Ganti anykernel.sh & ak3-core.sh ==="
          cp anykernel.sh AnyKernel3/anykernel.sh
          cp ak3-core.sh AnyKernel3/tools/ak3-core.sh
          cat AnyKernel3/anykernel.sh
             
    - name: Build kernel
      working-directory: kernel
      run: |
          export PATH="$TOOLCHAIN_CLANG:$PATH"
          export ARCH=arm64
          export LLVM=1
          export CC=clang
          export AR=llvm-ar
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-

          # TIDAK ada 'make <defconfig>' di sini: itu akan menimpa out/.config
          make ARCH=arm64 O=out CC=clang KSU_VERSION=40900 AR=llvm-ar LD=ld.lld \
               NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               -j"$(nproc --all)" Image.gz-dtb 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          ls -l out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image

    - name: Ringkasan error (kalau build gagal)
      if: failure()
      run: |
          echo "=== error / undefined ==="
          grep -nE "error:|undefined (reference|symbol)|\*\*\* \[" build.log | head -40 || true
          echo "=== DTC ==="
          grep -nE "FATAL ERROR|Error: .*dts" build.log | head -10 || true

    - name: Verifikasi mode SUSFS + simbol hook
      working-directory: kernel
      continue-on-error: true
      run: |
          grep -E "SUSFS_VERSION|using SUSFS_INLINE_HOOK|SukiSU-Ultra version" "$GITHUB_WORKSPACE/build.log" | head -5
          llvm-nm out/vmlinux | grep -E ' (ksu_handle_(sys_reboot|execveat|faccessat_user|stat_user|vfs_read|setresuid)|susfs_init)$' | sort -u | tee /tmp/syms
          n=$(wc -l < /tmp/syms)
          echo "Simbol ketemu: $n dari 7"
          test "$n" -eq 7
   
    - name: Pack AnyKernel3
      run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3 && zip -r9 ../cepheus_RIJEK_24.zip * -x README
     
    - name: Upload hasil build
      uses: actions/upload-artifact@v4
      with:
          name: cepheus-RIJEK-24
          path: |
            cepheus_RIJEK_24.zip           
